[package]
name = "jsqnl"
version = "0.1.0"
default-run = "jsqnl"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "A local SQL and JSON Lines database"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "unbounded_depth"] }
sha2 = "0.10"
subtle = "2.6"
zeroize = "1.9"
rusqlite = "0.34"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
