name: Verify the Rust Parquet port
on:
  push:
    branches: [rust-parquet-port]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt
      - run: |
          rustfmt +1.89.0 --edition 2024 src/parquet.rs tests/api.rs tests/cli.rs
          git diff
      - run: cargo +1.89.0 test
      - if: always()
        run: cat Cargo.lock
