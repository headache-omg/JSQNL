name: Verify the Rust Parquet port
on:
  push:
    branches: [rust-parquet-port]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'push' || github.head_ref == 'rust-parquet-port'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.89.0 --profile minimal
      - run: cargo +1.89.0 generate-lockfile && cat Cargo.lock
      - run: cargo +1.89.0 test --locked
